[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-seo-auditor"
version = "0.1.0"
description = "Audit WooCommerce, Shopify and custom store product/category pages for SEO and structured-data problems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin", email = "info@saizul.com" }]
keywords = ["seo", "ecommerce", "woocommerce", "shopify", "structured-data", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "rich>=13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://saizul.com"

[project.scripts]
ecom-seo-audit = "ecom_seo_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031", "UP032", "UP006", "UP007", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
"src/ecom_seo_audit/report.py" = ["E501"]
"src/ecom_seo_audit/issues.py" = ["E501"]
